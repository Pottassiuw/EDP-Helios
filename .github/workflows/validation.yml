name: Validation

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-metadata:
    name: Pull request metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue linkage and test evidence
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body ?? "";
            const errors = [];

            const closesIssue = /(?:^|\n)\s*(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+\b/im;
            if (!closesIssue.test(body)) {
              errors.push("Inclua `Closes #<número da Issue>` no corpo do PR.");
            }

            const evidenceMatch = body.match(
              /##\s+Evidências de validação\s*\n([\s\S]*?)(?=\n##\s|$)/i,
            );
            const evidence = evidenceMatch?.[1] ?? "";
            if (!evidenceMatch || !/- \[[xX]\]/.test(evidence)) {
              errors.push("Marque pelo menos um gate executado em `Evidências de validação`.");
            }

            const outcomeMatch = evidence.match(
              /Resultado e observações[^\n]*\n\s*```(?:text)?\s*\n([\s\S]*?)```/i,
            );
            const outcome = outcomeMatch?.[1].trim() ?? "";
            if (!outcome || /Substitua este texto pelo resultado resumido/i.test(outcome)) {
              errors.push("Registre um resultado resumido dos gates executados.");
            }

            if (errors.length > 0) {
              core.setFailed(errors.join("\n"));
            }

  backend-input:
    name: Backend / Input regression suite
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run isolated Input regression tests
        run: python -m pytest test_upload.py test_input_module.py

  frontend-input:
    name: Frontend / Input validation and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Input tests
        run: npx vitest run src/features/input

      - name: Build frontend
        run: npm run build

      - name: Check whitespace errors
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              git diff-tree --no-commit-id --check -r HEAD
            else
              git diff --check "$before" HEAD
            fi
          else
            git diff-tree --no-commit-id --check -r HEAD
          fi
