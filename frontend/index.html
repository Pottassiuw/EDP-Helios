<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: light)"
          href="/assets/RGB/Light/Regular/POS/EDP_Group_MasterLogo_RGB_Light_POS.svg" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)"
          href="/assets/RGB/Dark/Regular/NEG/EDP_Group_MasterLogo_RGB_Dark_NEG.svg" />
    <title>EDP-Helios — Painel de Gestão e Planejamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; font-family: var(--font-body, 'Inter', -apple-system, BlinkMacSystemFont, sans-serif); }
      body { background: var(--bg, #ffffff); overflow: hidden; }
      #root { height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Tema e densidade no <html> antes do primeiro paint. O React só assume
         depois de montar (SettingsProvider), e sem isto o usuário em tema
         escuro veria um flash do canvas branco em todo carregamento. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('edp_settings') || '{}');
          var tema = s.theme && s.theme !== 'system'
            ? s.theme
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = tema;
          document.documentElement.dataset.density = s.density || 'cozy';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
